<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ICoN10 — Coming Soon</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      padding: 32px 20px;
      color: #003b71;
      background: #f5f9fc;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .coming-soon {
      width: min(720px, 100%);
    }

    .coming-soon img {
      display: block;
      width: min(520px, 90%);
      height: auto;
      margin: 0 auto 32px;
    }

    .coming-soon h1 {
      margin: 0 0 16px;
      font-size: clamp(1.2rem, 3vw, 2rem);
      line-height: 1.1;
    }

    .coming-soon p {
      margin: 0;
      color: #58738c;
      font-size: clamp(1rem, 2vw, 1.25rem);
      line-height: 1.7;
    }
  </style>
</head>

<body>
  <main class="coming-soon">
    <img
      src="images/coming-soon.jpg"
      alt="ICoN10 Conference"
    >

    <h1>Coming Soon</h1>

    <p>
      The official ICoN10 conference website is currently under preparation.<br>
      Please check back soon for updates.
    </p>
  </main>
</body>

</html>
